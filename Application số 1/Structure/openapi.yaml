        '403':
          $ref: '#/components/responses/PartnerOriginNotAllowed'
        '429':
          $ref: '#/components/responses/PartnerRateLimited'
        '500':
          $ref: '#/components/responses/PartnerInternalError'

  /partner/v1/game-items:
    get:
      tags: [Partner – Public]
      operationId: partnerPublicGetGameItems
      summary: Danh sách gói bán của một bản phát hành trên kênh
      description: |
        Gói bán cấu hình riêng cho từng cặp (kênh, `gameId`, `appPackage`).
        `paymentMethods` được lọc theo `allowedPaymentMethods` của kênh (mảng
        rỗng = không lọc); gói hết phương thức vẫn được trả về. Chỉ trả gói đang
        hoạt động. Cache 60 giây.
      security: []
      parameters:
        - $ref: '#/components/parameters/PartnerChannelCode'
        - $ref: '#/components/parameters/PartnerGameId'
        - $ref: '#/components/parameters/PartnerAppPackage'
        - $ref: '#/components/parameters/Origin'
      responses:
        '200':
          description: Danh sách gói.
          headers:
            Access-Control-Allow-Origin:
              $ref: '#/components/headers/AccessControlAllowOrigin'
            Vary:
              $ref: '#/components/headers/VaryOrigin'
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/PartnerSuccess'
                  - type: object
                    properties:
                      data:
                        type: array
                        items:
                          $ref: '#/components/schemas/PartnerProduct'
              example:
                success: true
                data:
                  - ID: t019.vplay.w.voucher20
                    name: 6 Kim Phiếu
                    image: https://static-cmshub.vtvlive.vn/22/payment/f02e040ee264f5ff3ec8958be880d862-6.png
                    description: Nạp nhận 6 Kim Phiếu
                    price: 20000
                    amount: 170
                    sort: 1
                    rules:
                      - { key: SERVER_OP, operator: gte, value: '18597656322' }
                    paymentMethods:
                      - ID: 78280
                        code: VNPAY
                        name: Cổng thanh toán VNPAY
                        image: https://static-cmshub.vtvlive.vn/0/payment-method/f9e9458884b20407e67000ca3a993e65-vnpay.png
                        price: 20000
                        amount: 170
                        currencyCode: VND
                        note: ''
                        sort: 0
        '400':
          $ref: '#/components/responses/PartnerInvalidRequest'
        '403':
          $ref: '#/components/responses/PartnerForbidden'
        '429':
          $ref: '#/components/responses/PartnerRateLimited'
        '500':
          $ref: '#/components/responses/PartnerInternalError'

  # ---------------------------------------------------------------- Partner – S2S
  /partner/s2s/v1/games:
    get:
      tags: [Partner – S2S]
      operationId: partnerS2sGetGames
      summary: Danh sách game (bản S2S)
      description: |
        Như bản public nhưng không cache, trả cả bản phát hành đã tắt, kèm
        `status` và `updatedAt`. Kênh lấy từ `X-Channel`; `channelCode` trên
        query (nếu có) bị bỏ qua.
      security:
        - S2sChannel: []
          S2sTimestamp: []
          S2sNonce: []
          S2sSignature: []
      responses:
        '200':
          description: Danh sách bản phát hành.
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/PartnerSuccess'
                  - type: object
                    properties:
                      data:
                        type: array
                        items:
                          $ref: '#/components/schemas/PartnerGameS2s'
        '400':
          $ref: '#/components/responses/PartnerInvalidRequest'
        '401':
          $ref: '#/components/responses/PartnerS2sUnauthorized'
        '429':
          $ref: '#/components/responses/PartnerRateLimited'
        '500':
          $ref: '#/components/responses/PartnerInternalError'

  /partner/s2s/v1/game-items:
    get:
      tags: [Partner – S2S]
      operationId: partnerS2sGetGameItems
      summary: Danh sách gói bán (bản S2S)
      description: Như bản public nhưng không cache, trả cả gói đã tắt, kèm `status` và `updatedAt`.
      security:
        - S2sChannel: []
          S2sTimestamp: []
          S2sNonce: []
          S2sSignature: []
      parameters:
        - $ref: '#/components/parameters/PartnerGameId'
        - $ref: '#/components/parameters/PartnerAppPackage'
      responses:
        '200':
          description: Danh sách gói.
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/PartnerSuccess'
                  - type: object
                    properties:
                      data:
                        type: array
                        items:
                          $ref: '#/components/schemas/PartnerProductS2s'
        '400':
          $ref: '#/components/responses/PartnerInvalidRequest'
        '401':
          $ref: '#/components/responses/PartnerS2sUnauthorized'
        '403':
          $ref: '#/components/responses/PartnerChannelNotAllowed'
        '429':
          $ref: '#/components/responses/PartnerRateLimited'
        '500':
          $ref: '#/components/responses/PartnerInternalError'

  /partner/s2s/v1/transactions:
    get:
      tags: [Partner – S2S]
      operationId: partnerS2sGetTransactions
      summary: Lịch sử giao dịch để đối soát
      description: |
        Luôn giới hạn trong kênh đã ký. Phân trang keyset theo cursor.

        - Vòng lặp phải dừng khi `nextCursor === null` — trang cuối vừa đủ
          `limit` bản ghi vẫn trả cursor, lần gọi kế tiếp mới ra
          `items: []`, `nextCursor: null`.
        - `fromTime`/`toTime` là ISO 8601. **Không có offset thì hiểu là UTC**;
          chỉ có ngày thì là `00:00:00Z` của ngày đó, kể cả với `toTime`
          (bộ lọc là `createdAt <= toTime`). Lấy trọn ngày D:
          `fromTime=D&toTime=D+1`.
        - Nên truyền `fromTime` ngay lần gọi đầu; không có thì truy vấn quét từ
          giao dịch đầu tiên của kênh.
        - Kênh của giao dịch là kênh của gói tại thời điểm mua
          (`GameTransactions.channelCode`). Giao dịch tạo trước khi phía DB áp
          dụng bản ghi kênh đều thuộc `vtvlive`.
      security:
        - S2sChannel: []
          S2sTimestamp: []
          S2sNonce: []
          S2sSignature: []
      parameters:
        - name: limit
          in: query
          description: Số nguyên thập phân 1–200.
          schema: { type: integer, minimum: 1, maximum: 200, default: 50 }
        - name: nextCursor
          in: query
          description: Chuỗi opaque lấy từ `data.nextCursor` của lần gọi trước. Cursor rác → `400`.
          schema: { type: string, maxLength: 500 }
        - name: fromTime
          in: query
          schema: { type: string, maxLength: 40 }
          example: '2026-08-13T00:00:00+07:00'
        - name: toTime
          in: query
          schema: { type: string, maxLength: 40 }
          example: '2026-08-14T00:00:00+07:00'
      responses:
        '200':
          description: Một trang giao dịch.
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/PartnerSuccess'
                  - type: object
                    properties:
                      data:
                        $ref: '#/components/schemas/PartnerTransactionsPage'
              example:
                success: true
                data:
                  items:
                    - transId: '30567343'
                      platform: web
                      itemId: batluongnhan.vplay.w.voucher500
                      itemType: 1
                      itemName: 150 Kim Phiếu
                      itemAmount: 4250
                      itemAppAmount: '150'
                      accountId: '2688340562'
                      accountName: tentaikhoan
                      gameId: 36
                      gameName: null
                      serverId: '2010099'
                      serverName: null
                      characterId: '4249736029799'
                      characterName: null
                      status: 1
                      errorMsg: success
                      createdAt: '2026-08-13T07:22:51.100Z'
                  nextCursor: eyJpZCI6MzA1NjczNDN9
        '400':
          $ref: '#/components/responses/PartnerInvalidRequest'
        '401':
          $ref: '#/components/responses/PartnerS2sUnauthorized'
        '429':
          $ref: '#/components/responses/PartnerRateLimited'
        '500':
          $ref: '#/components/responses/PartnerInternalError'

