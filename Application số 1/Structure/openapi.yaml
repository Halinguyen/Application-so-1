  /sample/sessions:
    post:
      tags: [Dev]
      operationId: devWigameIssueSession
      summary: Mock WiGame — cấp session_token giả
      description: |
        Thay cổng WiGame cấp token khi người chơi bấm chơi; không có trong tài
        liệu đối tác, không ký. Truyền cùng `openid` qua nhiều lần để giả lập một
        người chơi quay lại.
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                openid:
                  type: string
                  maxLength: 128
                  description: Mặc định `wg_` + 24 hex ngẫu nhiên.
                display_name:
                  type: string
                  maxLength: 128
                  description: Mặc định `Người chơi WiGame`.
                game_id:
                  type: string
                  maxLength: 128
                  description: Mặc định `00000000-0000-4000-8000-000000000001`.
                ttl_seconds:
                  type: integer
                  minimum: 1
                  maximum: 86400
                  default: 3600
      responses:
        '201':
          description: Đã cấp token.
          content:
            application/json:
              schema:
                type: object
                required: [success, data]
                properties:
                  success: { type: boolean, enum: [true] }
                  data:
                    allOf:
                      - $ref: '#/components/schemas/WigameSession'
                      - type: object
                        required: [session_token]
                        properties:
                          session_token: { type: string, example: wgs_Q2x1… }
        '400':
          $ref: '#/components/responses/WigameInvalidParam'
        '429':
          $ref: '#/components/responses/NestTooManyRequests'
  /sample/sessions/verify:
    post:
      tags: [Dev]
      operationId: devWigameVerifySession
      summary: Mock WiGame — xác minh phiên người chơi
      description: Theo tài liệu WiGame; cách ký xem tag Dev.
      parameters:
        - { name: X-Partner-Key, in: header, required: true, schema: { type: string } }
        - { name: X-Timestamp, in: header, required: true, schema: { type: string, example: '1760000000' } }
        - { name: X-Nonce, in: header, required: true, schema: { type: string, pattern: '^[A-Za-z0-9_-]{8,64}$' } }
        - { name: X-Signature, in: header, required: true, schema: { type: string, pattern: '^[0-9a-f]{64}$' } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [session_token]
              properties:
                session_token: { type: string, example: wgs_Q2x1… }
      responses:
        '200':
          description: Phiên hợp lệ. Gọi lại được tới khi hết hạn (token không dùng một lần).
          content:
            application/json:
              schema:
                type: object
                required: [success, data]
                properties:
                  success: { type: boolean, enum: [true] }
                  data:
                    $ref: '#/components/schemas/WigameSession'
        '400':
          $ref: '#/components/responses/WigameInvalidParam'
        '401':
          description: |
            `MISSING_AUTH`, `INVALID_KEY`, `INVALID_TIMESTAMP`, `TIMESTAMP_EXPIRED`,
            `INVALID_NONCE`, `INVALID_SIGNATURE`, `NONCE_REUSED`, `INVALID_SESSION`.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WigameError'
              example:
                success: false
                error:
                  code: INVALID_SESSION
                  message: Token phiên không hợp lệ hoặc đã hết hạn
        '429':
          $ref: '#/components/responses/NestTooManyRequests'
  /test-view:
    get:
      tags: [Dev]
      operationId: devTestView
      summary: Trang kiểm tra layout
      responses:
        '200':
          $ref: '#/components/responses/Html'
        '429':
          $ref: '#/components/responses/NestTooManyRequests'

components:
  securitySchemes:
    SessionCookie:
      type: apiKey
      in: cookie
      name: h5_sdk.sid
      description: |
        Session express (Redis). Ngoài production tên có tiền tố môi trường,
        ví dụ `staging.h5_sdk.sid`. Tạo bởi `/{gameId}/auth`, đọc ở
        `/{gameId}/callback`; các route khác không dùng.
    PlaySession:
      type: apiKey
      in: header
      name: X-H5-Session
      description: |
        Handle phiên chơi: `sessionHandle` trong thẻ `#H5Session` của
        `/{gameId}/play` (43 ký tự base64url).

        - Chỉ hợp lệ cho đúng game đã mở phiên.
        - Hết hiệu lực khi logout, hoặc sau `PLAY_SESSION_TTL_SECONDS` không
          refresh.
        - Handle sai định dạng hoặc không tồn tại được coi như không có phiên.
    InternalKey:
      type: apiKey
      in: header
      name: X-Internal-Key
      description: |
        Khoá dùng chung với hub-cms-api (`INTERNAL_API_KEY`). So sánh
        constant-time. Thiếu, sai, hoặc server chưa cấu hình khoá → `401`.
    S2sChannel:
      type: apiKey
      in: header
      name: X-Channel
      description: Mã kênh (`channelCode`) VTVLive cấp.
    S2sTimestamp:
      type: apiKey
      in: header
      name: X-Timestamp
      description: Unix epoch tính bằng **giây** (1–11 chữ số), lệch tối đa ±300 giây so với server.
    S2sNonce:
      type: apiKey
      in: header
      name: X-Nonce
      description: Duy nhất cho mỗi request (khuyến nghị 16–32 byte hex/Base64URL). Server nhớ 10 phút.
    S2sSignature:
      type: apiKey
      in: header
      name: X-Signature
      description: '`Base64URL(HMAC-SHA256(secretKey, canonical))` — xem mô tả tag Partner – S2S.'

  parameters:
    GameId:
      name: gameId
      in: path
      required: true
      description: ID game (`dbo.Apps.id`).
      schema: { type: integer, minimum: 1 }
      example: 101
    ChannelCodeQuery:
      name: channelCode
      in: query
      description: |
        Mã kênh phân phối. Có giá trị thì kênh phải tồn tại, đang bật, và
        (nếu kênh đã có mapping) phân phối `appPackage`. Không truyền = hành vi
        trước khi có cấu hình kênh.
      schema: { type: string, minLength: 1, maxLength: 20 }
      example: mobifone
    ChannelCodePath:
      name: code
      in: path
      required: true
      description: Mã kênh.
      schema: { type: string, maxLength: 20 }
      example: mobifone
    PartnerChannelCode:
      name: channelCode
      in: query
      required: true
      description: Mã kênh. Phải xuất hiện đúng một lần (lặp tham số → `400`).
      schema: { type: string, minLength: 1, maxLength: 20 }
      example: mobifone
    PartnerGameId:
      name: gameId
      in: query
      required: true
      description: Chỉ gồm chữ số thập phân, trong khoảng INT32 dương (không dấu, không phần lẻ).
      schema: { type: integer, minimum: 1, maximum: 2147483647 }
      example: 36
    PartnerAppPackage:
      name: appPackage
      in: query
      required: true
      description: Bản phát hành cần lấy gói. Thiếu sẽ không đoán được bộ gói nên bị từ chối.
      schema: { type: string, minLength: 1, maxLength: 125 }
      example: batluongnhan.vplay.w
    Origin:
      name: Origin
      in: header
      required: false
      description: |
        Trình duyệt tự gửi. So khớp (không phân biệt hoa thường, bỏ `/` cuối)
        với `channel.allowedOrigins`. Vắng mặt = gọi từ server.
      schema: { type: string }
      example: https://portal.example.vn

  headers:
    Location:
      description: URL đích của redirect.
      schema: { type: string, format: uri }
    SessionSetCookie:
      description: Cookie session `h5_sdk.sid` (path `/`, `Secure`, `SameSite=None`).
      schema: { type: string }
    ContentSecurityPolicy:
      description: |
        Do Helmet đặt; `frame-ancestors` lấy từ `ALLOW_OPENER`, hoặc từ
        `allowedOrigins` của kênh khi request có `channelCode`.
      schema: { type: string }
    AccessControlAllowOrigin:
      description: Echo lại header `Origin` của request (chỉ có khi request có `Origin`).
      schema: { type: string }
    VaryOrigin:
      description: '`Origin` — chỉ có khi request có `Origin`.'
      schema: { type: string, enum: [Origin] }
    RetryAfter:
      description: Số giây cần chờ trước khi gọi lại.
      schema: { type: integer }

  responses:
    Html:
      description: Trang HTML.
      content:
        text/html:
          schema: { type: string }
    GameNotFound:
      description: '`gameId` không tồn tại (do `AppInfoMiddleware` trả, không qua trang lỗi).'
      content:
        text/html:
          schema: { type: string, enum: [Game not found] }
    ErrorPageRedirect:
      description: |
        Redirect tới `{appUrl}/error?detail=…&referrer=…[&replay=1]`. Giải mã
        `detail` (URL-decode rồi Base64-decode) được `ErrorPageDetail`.
      headers:
        Location:
          $ref: '#/components/headers/Location'
    NestBadRequest:
      description: Validation thất bại.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/NestError'
          example:
            statusCode: 400
            message: [detail should not be empty]
            error: Bad Request
    NestUnauthorized:
      description: Thiếu hoặc sai `X-Internal-Key`, hoặc server chưa cấu hình `INTERNAL_API_KEY`.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/NestError'
          example:
            statusCode: 401
            message: Unauthorized
    NestTooManyRequests:
      description: Vượt rate limit.
      headers:
        Retry-After:
          $ref: '#/components/headers/RetryAfter'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/NestError'
          example:
            statusCode: 429
            message: 'ThrottlerException: Too Many Requests'
    NestInternalError:
      description: Lỗi không được bắt (ví dụ OIDC trả lỗi khi refresh).
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/NestError'
          example:
            statusCode: 500
            message: Internal server error
    ChannelCodeResult:
      description: Mã kênh đã lưu.
      content:
        application/json:
          schema:
            allOf:
              - $ref: '#/components/schemas/ApiEnvelope'
              - type: object
                properties:
                  data:
                    type: object
                    required: [code]
                    properties:
                      code: { type: string }
          example:
            success: true
            messages: Thực hiện thành công.
            data: { code: newch }
    InternalBadRequest:
      description: |
        Body không qua validation (`NestError`, `message` là mảng) hoặc lỗi
        nghiệp vụ khác của catalog (`InternalError`).
      content:
        application/json:
          schema:
            oneOf:
              - $ref: '#/components/schemas/NestError'
              - $ref: '#/components/schemas/InternalError'
          example:
            statusCode: 400
            message:
              - 'allowedAuthGrants không hợp lệ: telco bắt buộc provider 1-50 ký tự'
            error: Bad Request
    InternalChannelNotFound:
      description: Kênh không tồn tại.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/InternalError'
          example:
            code: ERR_CHANNEL_NOT_FOUND
            description: Kênh phân phối không tồn tại
    PartnerInvalidRequest:
      description: |
        `INVALID_REQUEST` — thiếu/sai tham số (kể cả `limit` ngoài 1–200,
        `nextCursor` hỏng, thời gian không phải ISO 8601), hoặc thiếu hẳn một
        trong 4 header S2S (`error_description` nêu tên header).
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/PartnerError'
          examples:
            param:
              value:
                success: false
                error_code: INVALID_REQUEST
                error_description: Invalid request parameters
            header:
              value:
                success: false
                error_code: INVALID_REQUEST
                error_description: X-Signature is required
    PartnerOriginNotAllowed:
      description: |
        `ORIGIN_NOT_ALLOWED` — origin chưa đăng ký, kênh không tồn tại/bị tắt,
        hoặc kênh chưa cấu hình `allowedOrigins`. Kênh không tồn tại, bị tắt,
        hoặc đã hết hạn hợp đồng cũng trả mã này (không lộ trạng thái kênh cho người gọi ẩn danh).
      headers:
        Access-Control-Allow-Origin:
          $ref: '#/components/headers/AccessControlAllowOrigin'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/PartnerError'
          example:
            success: false
            error_code: ORIGIN_NOT_ALLOWED
            error_description: Request origin is not registered for this channel
    PartnerForbidden:
      description: |
        `ORIGIN_NOT_ALLOWED` (xem `/partner/v1/games`) hoặc
        `CHANNEL_NOT_ALLOWED` — cặp `gameId`/`appPackage` không tồn tại hoặc
        không được phân phối cho kênh. Hai trường hợp này cố ý gộp chung để
        không dò được kênh khác được phân phối gì; `404 NOT_FOUND` hiện không
        bao giờ được trả.
      headers:
        Access-Control-Allow-Origin:
          $ref: '#/components/headers/AccessControlAllowOrigin'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/PartnerError'
          example:
            success: false
            error_code: CHANNEL_NOT_ALLOWED
            error_description: Channel is not allowed to access this resource
    PartnerChannelNotAllowed:
      description: '`CHANNEL_NOT_ALLOWED` — cặp `gameId`/`appPackage` không tồn tại hoặc không được phân phối cho kênh.'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/PartnerError'
          example:
            success: false
            error_code: CHANNEL_NOT_ALLOWED
            error_description: Channel is not allowed to access this resource
    PartnerS2sUnauthorized:
      description: |
        Lỗi xác thực S2S:

        | `error_code` | Nguyên nhân |
        |---|---|
        | `INVALID_CHANNEL` | `X-Channel` không tồn tại hoặc bị tắt |
        | `CHANNEL_EXPIRED` | Kênh của `X-Channel` đã hết hạn hợp đồng |
        | `INVALID_TIMESTAMP` | `X-Timestamp` sai định dạng |
        | `REQUEST_EXPIRED` | `X-Timestamp` lệch quá ±5 phút |
        | `INVALID_SIGNATURE` | Chữ ký không khớp key nào còn hiệu lực |
        | `NONCE_REUSED` | `X-Nonce` đã dùng |
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/PartnerError'
          example:
            success: false
            error_code: INVALID_SIGNATURE
            error_description: Invalid request signature
    WigameInvalidParam:
      description: '`INVALID_PARAM` — thiếu hoặc sai tham số body.'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/WigameError'
          example:
            success: false
            error:
              code: INVALID_PARAM
              message: Thiếu hoặc sai session_token
    PartnerRateLimited:
      description: '`RATE_LIMITED` — vượt rate limit toàn cục.'
      headers:
        Retry-After:
          $ref: '#/components/headers/RetryAfter'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/PartnerError'
          example:
            success: false
            error_code: RATE_LIMITED
            error_description: Too many requests
    PartnerInternalError:
      description: '`INTERNAL_ERROR` — lỗi phía VTVLive; chi tiết chỉ được ghi log.'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/PartnerError'
          example:
            success: false
            error_code: INTERNAL_ERROR
            error_description: Internal server error

  schemas:
    # ------------------------------------------------ Envelopes & errors
    ApiEnvelope:
      type: object
      description: Envelope thành công của `ApiResponseInterceptor`.
      required: [success, messages, data]
      properties:
        success:
          type: boolean
          enum: [true]
        messages:
          type: string
          enum: [Thực hiện thành công.]
        data:
          description: Dữ liệu của endpoint.
    NestError:
      type: object
      description: Body lỗi mặc định của NestJS.
      required: [statusCode, message]
      properties:
        statusCode:
          type: integer
        message:
          oneOf:
            - type: string
            - type: array
              items: { type: string }
        error:
          type: string
          example: Bad Request
    ChannelTransactionsPage:
      type: object
      required: [items, nextCursor, total]
      properties:
        items:
          type: array
          items: { $ref: '#/components/schemas/ChannelTransaction' }
        nextCursor: { type: string, nullable: true }
        total:
          type: integer
          nullable: true
          description: Chỉ có ở trang đầu; `null` ở các trang có cursor.
    ChannelTransaction:
      type: object
      description: Một dòng `GameTransactions`, giữ tên cột DB và giữ `null`.
      properties:
        id: { type: integer, example: 15234001 }
        transId: { type: string }
        partnerTransId: { type: string, nullable: true }
        transType: { type: string, example: web }
        platform: { type: string }
        itemId: { type: string }
        itemType: { type: integer }
        itemCategoryId: { type: integer, nullable: true }
        itemName: { type: string, nullable: true }
        itemAmount: { type: integer, nullable: true }
        itemAppAmount: { type: integer, nullable: true }
        itemGiftcode: { type: string, nullable: true }
        uid: { type: string }
        username: { type: string, nullable: true }
        appId: { type: integer }
        appName: { type: string, nullable: true }
        serverId: { type: string }
        serverName: { type: string, nullable: true }
        characterId: { type: string }
        characterName: { type: string, nullable: true }
        status: { type: integer, description: 'Giá trị gốc. `1` = thành công, khác 1 = thất bại (`0` hoặc mã lỗi âm).' }
        errorMsg: { type: string, nullable: true }
        createdAt:
          type: string
          nullable: true
          description: Giờ VN kèm offset.
          example: '2026-10-21T10:15:30.123+07:00'
        createdBy: { type: string, nullable: true }
        retryCount: { type: integer, nullable: true }
        channelCode: { type: string, example: mobi }
    InternalError:
      type: object
      description: Lỗi nghiệp vụ của `/internal/channels/**`.
      required: [code, description]
      properties:
        code:
          type: string
          example: ERR_CHANNEL_NOT_FOUND
        description:
          type: string
    ErrorPageDetail:
      type: object
      description: |
        Nội dung đã giải mã của tham số `detail` trên trang lỗi:
        `JSON.parse(base64Decode(decodeURIComponent(detail)))`.
      required: [code, description, data]
      properties:
        code:
          type: string
          example: MISSING_AUTH_HASH
        description:
          type: string
          example: Thiếu dữ liệu xác thực
        data:
          type: array
          description: Dữ liệu phụ để trang lỗi hiển thị (ví dụ `ERR_ACCOUNT_NOT_REGISTER` kèm thông tin game).
          items:
            type: object
            required: [key, value]
            properties:
              key: { type: string }
              value: {}
    PartnerSuccess:
      type: object
      description: Envelope thành công của API đối tác — đúng hai field.
      required: [success, data]
      properties:
        success:
          type: boolean
          enum: [true]
        data:
          description: Dữ liệu nghiệp vụ.
    WigameSession:
      type: object
      description: Phiên người chơi WiGame (mock dev).
      required: [openid, display_name, game_id, expires_at]
      properties:
        openid:
          type: string
          example: wg_3f9a…
          description: Khoá định danh cố định của người chơi giữa các lần chơi.
        display_name: { type: string, example: Nguyễn Văn A }
        game_id: { type: string, example: d71dc184-… }
        expires_at: { type: string, example: '2026-10-07T21:00:00+07:00' }
    WigameError:
      type: object
      description: Envelope lỗi của API WiGame (mock dev).
      required: [success, error]
      properties:
        success: { type: boolean, enum: [false] }
        error:
          type: object
          required: [code, message]
          properties:
            code: { type: string }
            message: { type: string }
    PartnerError:
      type: object
      description: Envelope lỗi của API đối tác.
      required: [success, error_code, error_description]
      properties:
        success:
          type: boolean
          enum: [false]
        error_code:
          $ref: '#/components/schemas/PartnerErrorCode'
        error_description:
          type: string
          description: Chỉ để debug — nội dung có thể thay đổi, không rẽ nhánh theo field này.
    PartnerErrorCode:
      type: string
      description: |
        Mã lỗi là một phần của hợp đồng. `NOT_FOUND` được giữ cho tương lai,
        hiện không bao giờ được trả.
      enum:
        - INVALID_REQUEST
        - INVALID_CHANNEL
        - CHANNEL_EXPIRED
        - INVALID_TIMESTAMP
        - REQUEST_EXPIRED
        - NONCE_REUSED
        - INVALID_SIGNATURE
        - ORIGIN_NOT_ALLOWED
        - CHANNEL_NOT_ALLOWED
        - NOT_FOUND
        - RATE_LIMITED
        - INTERNAL_ERROR

    # ------------------------------------------------ Session API
    PlaySessionBootstrap:
      type: object
      description: |
        JSON trong thẻ `<script id="H5Session" type="application/json">` của
        `/{gameId}/play`.

        - `<`, `>`, `&`, U+2028, U+2029 được escape thành `\uXXXX` để token
          không đóng được thẻ.
        - `play.js` đọc xong thì gỡ thẻ khỏi DOM.
        - Không chứa refresh token.
      required: [sessionHandle, accessToken, idToken, expiresIn]
      properties:
        sessionHandle:
          type: string
          nullable: true
          pattern: '^[A-Za-z0-9_-]{43}$'
          description: |
            Gửi lại qua header `X-H5-Session`. `null` khi OIDC không trả
            refresh token, hoặc Redis lỗi lúc mở phiên.
        accessToken: { type: string, nullable: true }
        idToken: { type: string, nullable: true }
        expiresIn:
          type: integer
          nullable: true
          description: Thời gian sống của access token, giây.
          example: 3600
    RefreshTokenRequest:
      type: object
      description: |
        Field được validate nhưng **không** được dùng — refresh token luôn lấy
        từ phiên chơi trong Redis. Body rỗng hợp lệ (`play.js` gửi body rỗng).
        Field thừa (ví dụ `provider` cũ) bị bỏ qua.
      properties:
        refreshToken:
          type: string
          maxLength: 125
    TokenResponse:
      type: object
      description: Không có `refresh_token` — refresh token chỉ nằm trong phiên chơi.
      required: [id_token, access_token, expires_in]
      properties:
        id_token: { type: string }
        access_token: { type: string }
        expires_in:
          type: integer
          description: Thời gian sống của access token, giây.
          example: 1800
    RefreshTokenFailure:
      type: object
      required: [error, error_description]
      properties:
        error:
          type: string
          enum: [MISSING_REFRESH_TOKEN, SESSION_EXPIRED]
        error_description:
          type: string
          example: Phiên đăng nhập đã hết hạn, vui lòng đăng nhập lại
    LogoutResult:
      type: object
      required: [success]
      properties:
        success:
          type: boolean
          enum: [true]

    # ------------------------------------------------ Ops
    AppsflyerSdkKeys:
      type: object
      properties:
        AFSdkWebDevKey: { type: string }
        AFSdkBannerKey: { type: string }
    ClearCacheResult:
      type: object
      properties:
        key:
          type: string
          description: Key đã xoá; vắng mặt khi reset toàn bộ.

    # ------------------------------------------------ Internal – Channels
    AuthGrantType:
      type: string
      enum: [authorization_code, token_exchange, telco, social]
    ChannelSummary:
      type: object
      description: Cấu hình kênh; `s2sSecretKeys` không bao giờ được trả, chỉ có `secretKeyCount`.
      required:
        - code
        - name
        - status
        - allowedAuthGrants
        - allowedPaymentMethods
        - allowedOrigins
        - secretKeyCount
      properties:
        code: { type: string, example: mobifone }
        name: { type: string, example: MobiFone }
        status:
          type: integer
          enum: [0, 1]
          description: 1 = đang bật.
        icon:
          type: string
          nullable: true
        allowedAuthGrants:
          type: array
          nullable: true
          description: |
            Mảng rỗng = kênh chưa cấu hình. `null` = cột trong DB hỏng, hoặc SP
            chưa trả cột (chưa chạy `002`/`003`), xem `allowedAuthGrantsError`
            (request `/play` của kênh này bị chặn bằng `ERR_INVALID_CONFIG`).
          items:
            $ref: '#/components/schemas/AuthGrantConfig'
        allowedAuthGrantsError:
          type: string
          nullable: true
        paymentPageMode:
          $ref: '#/components/schemas/PaymentPageMode'
        allowedPaymentMethods:
          type: array
          description: Mã phương thức thanh toán được phép. Mảng rỗng = không lọc.
          items: { type: string }
          example: [VNPAY]
        allowedOrigins:
          type: array
          description: Origin portal được phép (opener, CSP `frame-ancestors`, API Partner – Public).
          items: { type: string }
          example: ['https://portal.mobifone.vn']
        secretKeyCount:
          type: integer
          minimum: 0
          maximum: 2
        tags:
          type: array
          items: { type: string }
          example: ['mobile', 'web']
        integratedPlayPage:
          type: string
          nullable: true
          enum: ['partner_host,partner_domain', 'partner_host,vlive_domain', 'vlive_host,vlive_domain', null]
        partnerContact: { type: string, nullable: true }
        vliveContact: { type: string, nullable: true }
        contractNumber: { type: string, nullable: true }
        contractNote: { type: string, nullable: true }
        effectiveDate:
          type: string
          nullable: true
          description: Giờ VN kèm offset. Không ảnh hưởng logic.
          example: '2026-01-01T00:00:00.000+07:00'
        expirationDate:
          type: string
          nullable: true
          description: >-
            Giờ VN kèm offset. Quá mốc này kênh bị chặn (ERR_CHANNEL_EXPIRED). null = không hết hạn.
            Kênh hết hạn ngay SAU thời điểm đã lưu: "còn hạn hết ngày 31/12/2026" phải gửi `2026-12-31T23:59:59.999+07:00` (không phải `T00:00:00`). Khi PUT, CMS gửi lại NGUYÊN VĂN giá trị đọc từ GET nếu người vận hành không sửa — không cho đi qua date picker chỉ có ngày.
          example: '2026-12-31T23:59:59.999+07:00'
    UpsertChannelRequest:
      type: object
      description: >-
        Replace toàn phần — field optional vắng mặt bị ghi thành `null`/`[]`.
        Chuỗi rỗng `''` được chấp nhận và lưu thành `null` cho `integratedPlayPage`,
        các field văn bản (`partnerContact`, `vliveContact`, `contractNumber`, `contractNote`)
        và cả hai field ngày (`effectiveDate`, `expirationDate`).
      required: [code, name, status, allowedAuthGrants]
      properties:
        code:
          type: string
          minLength: 1
          maxLength: 20
          description: Với `PUT` vẫn bắt buộc nhưng bị path ghi đè.
        name:
          type: string
          minLength: 1
          maxLength: 255
        status:
          type: integer
          enum: [0, 1]
        icon:
          type: string
          maxLength: 500
          description: Vắng mặt → `null`.
        allowedAuthGrants:
          type: array
          description: |
            Bắt buộc - vắng mặt hoặc `null` → `400`. Mảng rỗng = kênh chưa cấu
            hình. Tối đa **một** grant ngoài `authorization_code`; không lặp
            `grantType`.
          items:
            $ref: '#/components/schemas/AuthGrantConfig'
        paymentPageMode:
          $ref: '#/components/schemas/PaymentPageMode'
        allowedPaymentMethods:
          type: array
          items: { type: string }
          description: Vắng mặt → `[]` (không lọc).
        allowedOrigins:
          type: array
          description: |
            Mỗi phần tử là `*` hoặc `scheme://host[:port]` (không path, không
            `/` cuối). Vắng mặt → `[]` — xem cảnh báo ở `PUT`.
          items:
            type: string
            pattern: '^(\*|[a-zA-Z][a-zA-Z0-9+.-]*://[a-zA-Z0-9.-]+(:\d+)?)$'
        tags:
          type: array
          maxItems: 20
          uniqueItems: true
          items: { type: string, minLength: 1, maxLength: 50 }
          description: Vắng mặt → ghi [] (PUT replace toàn phần).
        integratedPlayPage:
          type: string
          enum: ['partner_host,partner_domain', 'partner_host,vlive_domain', 'vlive_host,vlive_domain']
        partnerContact: { type: string, maxLength: 255 }
        vliveContact: { type: string, maxLength: 255 }
        contractNumber: { type: string, maxLength: 50, pattern: '^[\x20-\x7E]*$' }
        contractNote: { type: string, maxLength: 1000 }
        effectiveDate:
          type: string
          description: ISO 8601 BẮT BUỘC có offset (Z hoặc ±hh:mm); phải ≤ expirationDate.
          example: '2026-01-01T00:00:00.000+07:00'
        expirationDate:
          type: string
          description: >-
            ISO 8601 BẮT BUỘC có offset. ⚠ Vắng mặt trong PUT = xoá hạn → kênh không bao giờ hết hạn.
            Kênh hết hạn ngay SAU thời điểm đã lưu: "còn hạn hết ngày 31/12/2026" phải gửi `2026-12-31T23:59:59.999+07:00` (không phải `T00:00:00`). Khi PUT, CMS gửi lại NGUYÊN VĂN giá trị đọc từ GET nếu người vận hành không sửa — không cho đi qua date picker chỉ có ngày.
          example: '2026-12-31T23:59:59.999+07:00'
    AuthGrantConfig:
      type: object
      required: [grantType]
      additionalProperties: false
      properties:
        grantType:
          $ref: '#/components/schemas/AuthGrantType'
        provider:
          type: string
          minLength: 1
          maxLength: 50
          description: |
            Provider key bên Identity. Bắt buộc với `telco`/`social`; không
            được có với `authorization_code`/`token_exchange`.
      example: { grantType: telco, provider: mobifone }
    PaymentPageMode:
      type: string
      nullable: true
      enum: [popup, post_message]
      description: |
        Nơi mở trang nạp. `popup` = popup billing của VTVLive trong trang play;
        `post_message` = đẩy `open_payment_page` lên cổng. `null` = `post_message`.
        PUT là replace toàn phần — vắng mặt bị ghi `null`.
    ChannelAppPackage:
      type: object
      required: [appPackageId, appPackageName, appId, partnerGameId]
      properties:
        appPackageId: { type: integer, example: 9 }
        appPackageName: { type: string, example: com.vtvlive.game101.web }
        appId: { type: integer, example: 101 }
        partnerGameId:
          type: string
          nullable: true
          maxLength: 125
          description: Mã game phía cổng đối tác; `null` = chưa gán.
          example: game-01
    AddChannelAppPackageRequest:
      type: object
      required: [appPackageId]
      properties:
        appPackageId:
          type: integer
          minimum: 1
          description: '`dbo.AppPackages.id`.'
        partnerGameId:
          type: string
          nullable: true
          maxLength: 125
          description: |
            Mã game phía cổng đối tác, duy nhất trong một kênh. Replace:
            vắng mặt / `null` / `""` xoá giá trị đang lưu.
          example: game-01
    SavedChannelAppPackage:
      type: object
      required: [id, appPackageName, appId, partnerGameId]
      properties:
        id:
          type: integer
          description: '`appPackageId` vừa lưu.'
        appPackageName: { type: string }
        appId: { type: integer }
        partnerGameId: { type: string, nullable: true }
    PartnerGameAppPackage:
      type: object
      required: [appId, appPackageId, appPackageName]
      properties:
        appId: { type: integer, example: 101 }
        appPackageId: { type: integer, example: 9 }
        appPackageName: { type: string, example: com.vtvlive.game101.web }
    RowsAffected:
      type: object
      required: [rowsAffected]
      properties:
        rowsAffected:
          type: integer
          minimum: 0
    RotateSecretResult:
      type: object
      required: [secretKey, keyCount]
      properties:
        secretKey:
          type: string
          pattern: '^[0-9a-f]{64}$'
          description: Chỉ trả về một lần; phải chuyển cho đối tác qua kênh an toàn.
        keyCount:
          type: integer
          minimum: 1
          maximum: 2

    # ------------------------------------------------ Partner
    PartnerGame:
      type: object
      description: Một bản phát hành của một game trên kênh.
      required:
        - gameId
        - gameName
        - gameIcon
        - gameDescription
        - gameWidth
        - gameHeight
        - gamePlayUrl
        - appPackage
        - appPackageGameIcon
        - platform
      properties:
        gameId: { type: integer }
        gameName: { type: string }
        gameIcon: { type: string, format: uri }
        gameDescription: { type: string }
        gameWidth:
          type: string
          description: Chiều rộng khung chơi đề xuất (pixel, dạng chuỗi). `"0"` = không có khuyến nghị.
          example: '0'
        gameHeight:
          type: string
          description: Chiều cao khung chơi đề xuất (pixel, dạng chuỗi). `"0"` = không có khuyến nghị.
          example: '0'
        gamePlayUrl: { type: string, format: uri }
        appPackage: { type: string }
        appPackageGameIcon:
          type: string
          description: Hiện **luôn là chuỗi rỗng**. Hiển thị theo mẫu `appPackageGameIcon || gameIcon`.
        platform:
          type: string
          example: web
    PartnerGameS2s:
      allOf:
        - $ref: '#/components/schemas/PartnerGame'
        - $ref: '#/components/schemas/S2sSyncFields'
    PartnerRule:
      type: object
      description: |
        Điều kiện áp dụng gói — **chỉ để hiển thị**, server kiểm tra lúc mua.
        Nhiều điều kiện là AND.
      required: [key, operator, value]
      properties:
        key:
          type: string
          description: 'Hiện có: `SERVER_OP` (số ngày từ khi mở server), `EVENT_WHEEL_TURN` (số lượt quay).'
          example: SERVER_OP
        operator:
          type: string
          enum: [eq, neq, gt, gte, lt, lte, in, nin]
        value:
          type: string
          description: Luôn là chuỗi, kể cả điều kiện dạng số.
    PartnerPaymentMethod:
      type: object
      required: [ID, code, name, image, price, amount, currencyCode, note, sort]
      properties:
        ID: { type: integer }
        code: { type: string, example: VNPAY }
        name: { type: string }
        image: { type: string, format: uri }
        price:
          type: number
          description: Giá thực tế theo tiền tệ thật khi trả bằng phương thức này.
        amount:
          type: number
          description: Giá thực tế theo OnG khi trả bằng phương thức này.
        currencyCode: { type: string, example: VND }
        note: { type: string }
        sort: { type: integer }
    PartnerProduct:
      type: object
      required: [ID, name, image, description, price, amount, sort, rules, paymentMethods]
      properties:
        ID:
          type: string
          example: t019.vplay.w.voucher20
        name: { type: string }
        image: { type: string, format: uri }
        description: { type: string }
        price:
          type: number
          description: Giá mặc định (tiền tệ thật) để hiển thị; lúc thanh toán dùng giá trong `paymentMethods[]`.
        amount:
          type: number
          description: Giá mặc định theo OnG.
        sort:
          type: integer
          description: Thứ tự hiển thị đề xuất, tăng dần.
        rules:
          type: array
          items:
            $ref: '#/components/schemas/PartnerRule'
        paymentMethods:
          type: array
          description: Đã lọc theo `allowedPaymentMethods` của kênh; có thể rỗng.
          items:
            $ref: '#/components/schemas/PartnerPaymentMethod'
    PartnerProductS2s:
      allOf:
        - $ref: '#/components/schemas/PartnerProduct'
        - $ref: '#/components/schemas/S2sSyncFields'
    S2sSyncFields:
      type: object
      required: [status, updatedAt]
      properties:
        status:
          type: integer
          description: Trạng thái phân phối; `0` = đã tắt (vẫn trả để đối tác cập nhật CSDL).
        updatedAt:
          type: string
          description: Thời điểm cập nhật gần nhất (ISO 8601).
    PartnerTransaction:
      type: object
      required:
        - transId
        - platform
        - itemId
        - itemType
        - itemName
        - itemAmount
        - itemAppAmount
        - accountId
        - accountName
        - gameId
        - gameName
        - serverId
        - serverName
        - characterId
        - characterName
        - status
        - errorMsg
        - createdAt
      properties:
        transId: { type: string }
        platform: { type: string, example: web }
        itemId:
          type: string
          description: Khớp `ID` của `PartnerProduct`.
        itemType: { type: integer }
        itemName:
          type: string
          description: Tên gói tại thời điểm mua.
        itemAmount:
          type: number
          description: Giá theo OnG.
        itemAppAmount:
          type: string
          description: Giá theo item trong game.
        accountId: { type: string }
        accountName: { type: string }
        gameId: { type: integer }
        gameName: { type: string, nullable: true }
        serverId: { type: string }
        serverName: { type: string, nullable: true }
        characterId: { type: string }
        characterName: { type: string, nullable: true }
        status:
          type: integer
          description: '`1` = thành công, khác `1` = thất bại.'
        errorMsg: { type: string }
        createdAt:
          type: string
          format: date-time
    PartnerTransactionsPage:
      type: object
      required: [items, nextCursor]
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/PartnerTransaction'
        nextCursor:
          type: string
          nullable: true
          description: '`null` = hết dữ liệu. Chuỗi opaque — không tự dựng hay giải mã.'
