                          $ref: '#/components/schemas/PartnerGame'
              example:
                success: true
                data:
                  - gameId: 36
                    gameName: Bát Lượng Nhân
                    gameIcon: https://static-cmshub.vtvlive.vn/36/icon.png
                    gameDescription: Game nhập vai
                    gameWidth: '0'
                    gameHeight: '0'
                    gamePlayUrl: https://game.example.vn/batluongnhan/play
                    appPackage: batluongnhan.vplay.w
                    appPackageGameIcon: ''
                    platform: web
        '400':
