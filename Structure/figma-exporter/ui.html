<!doctype html>
<meta charset="utf-8" />
<style>
  body { font: 12px/1.5 system-ui, sans-serif; margin: 12px; color: #222; }
  label { display: block; margin: 8px 0 2px; font-weight: 600; }
  input[type="text"], select { width: 100%; box-sizing: border-box; padding: 4px; }
  button { margin-top: 12px; padding: 6px 12px; }
  #log { margin-top: 10px; max-height: 110px; overflow: auto; color: #555; white-space: pre-wrap; }
  .err { color: #b00020; }
  small { color: #666; }
</style>
<div>
  Chọn các frame cần xuất (vd. <b>Trang chủ</b>, <b>Bảng xếp hạng</b>) trên canvas, rồi bấm Xuất.
</div>
<label for="key">File key của Figma</label>
<input id="key" type="text" placeholder="đoạn sau /design/ trong đường link, vd. wDARmroVWOMtuCENhzj8aB" />
<small id="keyhint"></small>
<label for="scale">Độ phân giải</label>
<select id="scale"><option value="2" selected>2x (nét hơn, ZIP lớn hơn)</option><option value="1">1x</option></select>
<button id="go">Xuất ZIP</button>
<div id="log"></div>

<script>
  var files = [];
  var logEl = document.getElementById("log");
  function log(t, cls) {
    var d = document.createElement("div");
    d.textContent = t;
    if (cls) d.className = cls;
    logEl.appendChild(d);
    logEl.scrollTop = logEl.scrollHeight;
  }

  // ---- minimal ZIP writer (method 0 = stored; PNGs are already compressed) ----
  var CRC_TABLE = (function () {
    var t = new Uint32Array(256);
    for (var n = 0; n < 256; n++) {
      var c = n;
      for (var k = 0; k < 8; k++) c = c & 1 ? 0xedb88320 ^ (c >>> 1) : c >>> 1;
      t[n] = c >>> 0;
    }
    return t;
  })();
  function crc32(bytes) {
    var c = 0xffffffff;
    for (var i = 0; i < bytes.length; i++) c = CRC_TABLE[(c ^ bytes[i]) & 0xff] ^ (c >>> 8);
    return (c ^ 0xffffffff) >>> 0;
  }
  function buildZip(entries) {
    var enc = new TextEncoder();
    var chunks = [];
    var central = [];
    var offset = 0;
    entries.forEach(function (e) {
      var name = enc.encode(e.name);
      var crc = crc32(e.bytes);
      var local = new DataView(new ArrayBuffer(30));
      local.setUint32(0, 0x04034b50, true);
      local.setUint16(4, 20, true);
      local.setUint16(6, 0x0800, true); // UTF-8 names
      local.setUint16(8, 0, true);
      local.setUint32(14, crc, true);
      local.setUint32(18, e.bytes.length, true);
      local.setUint32(22, e.bytes.length, true);
      local.setUint16(26, name.length, true);
      chunks.push(new Uint8Array(local.buffer), name, e.bytes);
      var cd = new DataView(new ArrayBuffer(46));
      cd.setUint32(0, 0x02014b50, true);
      cd.setUint16(4, 20, true);
      cd.setUint16(6, 20, true);
      cd.setUint16(8, 0x0800, true);
      cd.setUint32(16, crc, true);
      cd.setUint32(20, e.bytes.length, true);
      cd.setUint32(24, e.bytes.length, true);
      cd.setUint16(28, name.length, true);
      cd.setUint32(42, offset, true);
      central.push(new Uint8Array(cd.buffer), name);
      offset += 30 + name.length + e.bytes.length;
    });
    var cdSize = central.reduce(function (s, c) { return s + c.length; }, 0);
    var end = new DataView(new ArrayBuffer(22));
    end.setUint32(0, 0x06054b50, true);
    end.setUint16(8, entries.length, true);
    end.setUint16(10, entries.length, true);
    end.setUint32(12, cdSize, true);
    end.setUint32(16, offset, true);
    return new Blob(chunks.concat(central, [new Uint8Array(end.buffer)]), { type: "application/zip" });
  }

  document.getElementById("go").onclick = function () {
    files = [];
    logEl.textContent = "";
    log("Đang xuất…");
    parent.postMessage({ pluginMessage: { type: "export", scale: Number(document.getElementById("scale").value) } }, "*");
  };

  onmessage = function (event) {
    var m = event.data.pluginMessage;
    if (!m) return;
    if (m.type === "file") files.push({ name: m.name, bytes: m.bytes });
    else if (m.type === "progress") log("Ảnh " + m.done + "/" + m.total);
    else if (m.type === "warn") log(m.message, "err");
    else if (m.type === "error") log(m.message, "err");
    else if (m.type === "done") {
      var meta = m.meta;
      var typed = document.getElementById("key").value.trim();
      meta.fileKey = typed || meta.fileKey;
      if (!meta.fileKey) {
        log("Thiếu File key: nhập đoạn sau /design/ trong đường link Figma rồi bấm Xuất lại.", "err");
        return;
      }
      files.push({ name: "nodes.json", bytes: new TextEncoder().encode(JSON.stringify(meta)) });
      var url = URL.createObjectURL(buildZip(files));
      var a = document.createElement("a");
      a.href = url;
      a.download = "figma-export.zip";
      document.body.appendChild(a);
      a.click();
      a.remove();
      log("Xong: " + (files.length - 1) + " ảnh, " + meta.nodes.length + " node. Nhập file figma-export.zip vào wizard.");
    }
  };
</script>
